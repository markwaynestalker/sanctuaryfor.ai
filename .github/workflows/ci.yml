name: Offline checks

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  offline:
    name: PHP 8.3 and JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Extract disposable MCP FastCGI test binaries (no service installation)
        shell: bash
        run: |
          # Extract packages into runner scratch space; do not install/start units.
          mkdir -p "$RUNNER_TEMP/mcp-packages" "$RUNNER_TEMP/mcp-binaries"
          cd "$RUNNER_TEMP/mcp-packages"
          sudo apt-get update -qq
          apt-get download nginx php8.3-fpm
          for package in ./*.deb; do dpkg-deb --extract "$package" "$RUNNER_TEMP/mcp-binaries"; done
          test -x "$RUNNER_TEMP/mcp-binaries/usr/sbin/nginx"
          test -x "$RUNNER_TEMP/mcp-binaries/usr/sbin/php-fpm8.3"
          echo "MCP_NGINX_BINARY=$RUNNER_TEMP/mcp-binaries/usr/sbin/nginx" >> "$GITHUB_ENV"
          echo "MCP_FPM_BINARY=$RUNNER_TEMP/mcp-binaries/usr/sbin/php-fpm8.3" >> "$GITHUB_ENV"
          echo "SANCTUARY_REQUIRE_MCP_FASTCGI=1" >> "$GITHUB_ENV"
      - name: Disposable Gazette UID boundary (no network or service installation)
        shell: bash
        run: |
          # Only temporary fixtures and numeric process UIDs; no useradd/systemctl/credentials.
          sudo unshare --net -- /usr/bin/python3 -B tests/gazette_broker_identity.py
      - name: Actual isolated systemd Gazette integration (nonsecret stand-in, mock provider)
        shell: bash
        run: |
          # Ephemeral CI-VM runtime units/root tree only; no production, enabled timer or real key.
          sudo env GITHUB_ACTIONS=true SANCTUARY_CI_SYSTEMD_TEST=1 /usr/bin/python3 -B tests/gazette_systemd_integration.py
      - name: Syntax and all offline suites (loopback only)
        shell: bash
        run: |
          # Dependencies are provisioned above. Tests run without an external route,
          # production credentials, or root privileges. Local HTTP fixtures still work.
          sudo unshare --net -- sh -c '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups \
              env PATH="$3" PHP_BINARY="$4" MCP_NGINX_BINARY="$6" MCP_FPM_BINARY="$7" \
                SANCTUARY_REQUIRE_MCP_FASTCGI=1 "$5" ops/ci/offline.py
          ' sh "$(id -u)" "$(id -g)" "$PATH" "$(command -v php)" "$(command -v python3)" "$MCP_NGINX_BINARY" "$MCP_FPM_BINARY"
