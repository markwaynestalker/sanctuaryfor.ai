name: Toronto deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a deployment in progress. The server also takes an exclusive lock.
concurrency:
  group: toronto-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Approved Toronto release
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.TORONTO_DEPLOY_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {}
    environment:
      name: production
      url: https://sanctuaryfor.ai
    steps:
      # Environment protection is evaluated before this job gets any secrets.
      - name: Connect deployment runner to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:sanctuarytorontodeploy
          version: '1.104.2'
          sha256sum: 512f613ed7d04fc7282f7dc5bd76aa105aae28168fbb9357eb749ebcbc29f0ae
          use-cache: 'false'
          args: --accept-dns=false
          timeout: 60s
          retry: '1'
      # No checkout, third-party SSH action, or repository program runs with this key.
      - name: Deploy the exact tested main commit
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          TORONTO_HOST: '100.75.63.110'
          TORONTO_USER: ${{ vars.TORONTO_DEPLOY_USER }}
          TORONTO_PORT: '22'
          KNOWN_HOSTS: ${{ vars.TORONTO_DEPLOY_KNOWN_HOSTS }}
          PRIVATE_KEY: ${{ secrets.TORONTO_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TORONTO_HOST" == '100.75.63.110' ]]
          [[ "$TORONTO_USER" == 'sanctuarydeploy' ]]
          [[ "$TORONTO_PORT" == '22' ]]
          [[ -n "$PRIVATE_KEY" && -n "$KNOWN_HOSTS" ]]
          umask 077
          directory="$(mktemp -d)"
          trap 'rm -f -- "$directory/key" "$directory/known_hosts"; rmdir -- "$directory"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$directory/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$directory/known_hosts"
          unset PRIVATE_KEY KNOWN_HOSTS
          deployment_status=0
          ssh -F /dev/null -i "$directory/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=sanctuary-toronto-deploy \
            -o UserKnownHostsFile="$directory/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -p "$TORONTO_PORT" -- "$TORONTO_USER@$TORONTO_HOST" "deploy $TARGET_SHA" || deployment_status=$?
          if [[ "$deployment_status" -eq 21 ]]; then
            printf '::error title=Owner operational activation required::Toronto refused this release before activation. CI approval does not replace the separate owner review. See the job summary for the exact SHA and next step.\n'
            {
              printf '## Owner operational activation required\n\n'
              printf 'Requested release: `%s`\n\n' "$TARGET_SHA"
              printf '**Not deployed by this run.** The server refused protected operational changes (exit 21), rather than a failing application test.\n\n'
              printf 'Protected scope includes schema/migration files, `.env.example`, Director registration, systemd templates and deployment-helper source. Review the full diff from the installed release.\n\n'
              printf 'After separate explicit owner approval, the owner can activate reviewed current main locally on Toronto:\n\n```bash\n'
              printf 'sudo -u sanctuarydeploy /usr/bin/python3 -I /usr/local/lib/sanctuaryfor-ai-deploy/toronto.py activate-reviewed %s\n```\n\n' "$TARGET_SHA"
              printf 'The helper still requires current main, unchanged releases, locking and health checks. If main has advanced, review the new SHA instead. The restricted workflow key cannot invoke this owner command.\n\n'
              printf 'Migrations, ENV edits, feature activation and timer changes need their own explicit approval. Rerunning this workflow does not supply operational approval.\n\n'
              printf 'See [Toronto operational releases](https://github.com/markwaynestalker/sanctuaryfor.ai/blob/%s/docs/TORONTO_DEPLOYMENT.md#recovery-and-separate-operational-releases).\n' "$TARGET_SHA"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 21
          fi
          if [[ "$deployment_status" -ne 0 ]]; then
            printf '::error title=Toronto release failed::SSH/server exit %s. No success is claimed; inspect the server diagnostic and health/rollback evidence.\n' "$deployment_status"
            printf '## Toronto release failed\n\nRequested release: `%s`\n\nSSH/server exit: `%s`. No verified deployment is claimed. Inspect the diagnostic before retrying.\n' "$TARGET_SHA" "$deployment_status" >> "$GITHUB_STEP_SUMMARY"
            exit "$deployment_status"
          fi
          printf 'Verified Toronto release: `%s`\n' "$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
