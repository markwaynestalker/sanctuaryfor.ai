; Owner-installed only after approval. Separate pool in existing PHP 8.3-FPM.
; No new service or village scheduler/configuration change.
[sanctuary-mcp]
user = www-data
group = www-data
listen = /run/php/sanctuary-mcp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 100
request_terminate_timeout = 10s
request_terminate_timeout_track_finished = yes
clear_env = yes
catch_workers_output = no
security.limit_extensions = .php
env[LITTLE_SPARKS_DB] = /var/lib/sanctuaryfor-ai/village.sqlite
env[LITTLE_SPARKS_MCP_TOKEN_FILE] = /etc/sanctuaryfor-ai-mcp/token
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = off
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 8
