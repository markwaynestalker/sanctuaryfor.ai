# Owner-installed inside the existing sanctuaryfor.ai HTTPS server {}.
# Its existing root must be /var/www/sanctuaryfor.ai/public (versioned symlink).
# Explicit FastCGI parameters avoid duplicate SCRIPT_FILENAME/DOCUMENT_ROOT
# definitions inherited from distro snippets. Uses a bounded pool in the existing
# PHP-FPM daemon; install the reviewed pool template separately before activation.
location = /mcp {
    # Override inherited residential-IP/HTTP-Basic gates for this bearer route.
    allow all;
    auth_basic off;
    client_max_body_size 8k;
    client_body_timeout 5s;
    limit_req zone=sanctuary_mcp_requests burst=10 nodelay;
    limit_req_status 429;
    limit_conn sanctuary_mcp_connections 4;
    limit_conn_status 429;
    access_log /var/log/nginx/sanctuary-mcp-access.log sanctuary_mcp;
    fastcgi_pass unix:/run/php/sanctuary-mcp.sock;
    fastcgi_read_timeout 10s;
    fastcgi_send_timeout 5s;
    fastcgi_cache off;
    fastcgi_intercept_errors off;
    fastcgi_pass_request_headers off;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param SCRIPT_FILENAME $realpath_root/mcp.php;
    fastcgi_param SCRIPT_NAME /mcp;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param DOCUMENT_URI /mcp;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param REQUEST_SCHEME $scheme;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE nginx;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param REMOTE_PORT $remote_port;
    fastcgi_param SERVER_ADDR $server_addr;
    fastcgi_param SERVER_PORT $server_port;
    fastcgi_param SERVER_NAME $server_name;
    fastcgi_param REDIRECT_STATUS 200;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_ACCEPT $http_accept;
    fastcgi_param HTTP_ORIGIN $http_origin if_not_empty;
    fastcgi_param HTTP_MCP_PROTOCOL_VERSION $http_mcp_protocol_version if_not_empty;
    fastcgi_param SANCTUARY_MCP_ROUTE 1;
}

# Exact blocks override a site's generic PHP/static locations.
location = /mcp.php { return 404; }
location ^~ /mcp/ { return 404; }
