# Owner-installed in nginx's http {} context, never in a server {} block.
# Shared service limits, not residential-IP restrictions. No token/query logging.
limit_req_zone $server_name zone=sanctuary_mcp_requests:1m rate=60r/m;
limit_conn_zone $server_name zone=sanctuary_mcp_connections:1m;
log_format sanctuary_mcp '$time_iso8601 status=$status seconds=$request_time';
